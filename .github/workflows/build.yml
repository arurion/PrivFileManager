name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PrivFileManager-debug
          path: app/build/outputs/apk/debug/*.apk

      # `if:` 内で secrets コンテキストを直接評価できないため(Unrecognized named-value: 'secrets')、
      # 一度 env 経由でこのstepの中で判定し、outputsとして次のstepへ渡す。
      - name: Check signing secrets
        id: check_signing
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_20260801_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode signing keystore
        if: steps.check_signing.outputs.has_keystore == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_20260801_BASE64 }}
        run: |
          echo "$KS_B64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"

      - name: Build release APK (signed)
        if: steps.check_signing.outputs.has_keystore == 'true'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD_20260801: ${{ secrets.KEYSTORE_PASSWORD_20260801 }}
          KEY_ALIAS_20260801: ${{ secrets.KEY_ALIAS_20260801 }}
        run: gradle assembleRelease --no-daemon

      - name: Build release APK (unsigned fallback)
        if: steps.check_signing.outputs.has_keystore == 'false'
        run: gradle assembleRelease --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: PrivFileManager-release
          path: app/build/outputs/apk/release/*.apk

      # keystoreファイルをrunner上に残さない
      - name: Clean up keystore
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/release.keystore"
